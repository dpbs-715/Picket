[package]
name = "picket"
version = "0.2.2"
description = "Picket desktop Git agent"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[features]
default = []
smoke-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSAnimationContext",
  "NSApplication",
  "NSColor",
  "NSEvent",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSWindow",
  "NSWorkspace",
  "block2",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSError",
  "NSGeometry",
  "NSString",
  "std",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "CAMediaTimingFunction",
] }

[dev-dependencies]
ts-rs = "12"
