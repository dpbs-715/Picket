name: Release macOS (Internal Test)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build & Verify macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup official Node.js (arm64)
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          architecture: 'arm64'
          cache: 'pnpm'

      - name: Verify version consistency
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/package-dmg.mjs --check-version-only --tag "$REF_NAME"
          else
            node scripts/package-dmg.mjs --check-version-only
          fi

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check local Chrome binary for UI verification
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$CHROME" ]; then
            echo "Required Chrome binary not found at $CHROME" >&2
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      - name: Run headless Chrome UI verification
        run: pnpm ui:verify

      - name: Build macOS .app bundle
        run: pnpm desktop build

      - name: Verify packaged .app bundle
        run: pnpm package:verify --ui

      - name: Package and verify DMG and updater bundle
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/package-dmg.mjs --tag "$REF_NAME" --out-dir dist-release
          else
            node scripts/package-dmg.mjs --out-dir dist-release
          fi

      - name: Upload DMG and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picket-macos-arm64-dmg
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create Draft GitHub Release
    needs: build-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: picket-macos-arm64-dmg
          path: dist-release

      - name: Verify artifacts and create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          DMG_FILE="Picket-${RELEASE_TAG}-macOS-arm64.dmg"
          SHA_FILE="${DMG_FILE}.sha256"
          TAR_FILE="Picket-${RELEASE_TAG}-macOS-arm64.app.tar.gz"
          TAR_SHA_FILE="${TAR_FILE}.sha256"
          SIG_FILE="${TAR_FILE}.sig"
          LATEST_FILE="latest.json"

          if [ ! -f "dist-release/${DMG_FILE}" ] || [ ! -f "dist-release/${SHA_FILE}" ] || [ ! -f "dist-release/${TAR_FILE}" ] || [ ! -f "dist-release/${TAR_SHA_FILE}" ]; then
            echo "Expected release artifacts missing for ${RELEASE_TAG}" >&2
            ls -la dist-release >&2
            exit 1
          fi

          (cd dist-release && sha256sum -c "${SHA_FILE}" && sha256sum -c "${TAR_SHA_FILE}")
          SHA256="$(awk '{print $1}' "dist-release/${SHA_FILE}")"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for ${RELEASE_TAG}. Delete an unpublished draft manually or bump to a new version tag instead of overwriting." >&2
            exit 1
          fi

          UPLOAD_ASSETS=(
            "dist-release/${DMG_FILE}"
            "dist-release/${SHA_FILE}"
            "dist-release/${TAR_FILE}"
            "dist-release/${TAR_SHA_FILE}"
          )
          UPDATER_NOTE="In-app auto-update manifest (\`latest.json\`) was skipped because \`TAURI_SIGNING_PRIVATE_KEY\` secret was not configured."
          if [ -f "dist-release/${SIG_FILE}" ] && [ -f "dist-release/${LATEST_FILE}" ]; then
            UPLOAD_ASSETS+=("dist-release/${SIG_FILE}" "dist-release/${LATEST_FILE}")
            UPDATER_NOTE="Signed in-app update bundle (\`${TAR_FILE}\`, \`${SIG_FILE}\`, and \`${LATEST_FILE}\`) is included for existing Picket installations."
          fi

          cat > release-notes.md <<EOF
          > **Internal Test Build (Unsigned / Ad-hoc Signed)**
          > This build is **not** signed with an Apple Developer ID certificate or notarized by Apple. It is intended for internal testing on **macOS 14.0+ (Apple Silicon / arm64)** only.

          ## Highlights

          <!-- Maintainer: summarize user-facing changes before publishing this draft. -->

          ## Platform & Build Info

          - **Supported Platform**: macOS 14.0+ on Apple Silicon (\`arm64\`)
          - **Commit**: \`${COMMIT_SHA}\`
          - **DMG File**: \`${DMG_FILE}\`
          - **SHA-256**: \`${SHA256}\`
          - **In-App Updates**: ${UPDATER_NOTE}

          ## Installation (First Time)

          1. Download \`${DMG_FILE}\` and optionally verify its checksum:
             \`\`\`bash
             shasum -a 256 -c ${SHA_FILE}
             \`\`\`
          2. Open the DMG and drag **Picket.app** into **Applications**.
          3. Because this internal test build is not Apple notarized, clear the browser quarantine attribute before first launch:
             \`\`\`bash
             xattr -dr com.apple.quarantine /Applications/Picket.app
             \`\`\`
          4. Launch **Picket** from **Applications**. Subsequent updates can be installed from **Settings → About & Updates** once the signing key is configured.

          ## Known Limitations

          - macOS Apple Silicon (\`arm64\`) only; Intel Macs, Windows, and Linux are not supported.
          - Ad-hoc signed internal build (Apple Developer ID signing & notarization are planned for public releases).
          EOF

          # Single-channel release: omit --prerelease so GitHub's /releases/latest/download/latest.json resolves cleanly once published.
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --target "${COMMIT_SHA}" \
            --title "Picket ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            "${UPLOAD_ASSETS[@]}"
